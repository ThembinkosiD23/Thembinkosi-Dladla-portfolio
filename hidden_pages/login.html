<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access - Thembinkosi Dladla</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header .lock-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        .login-header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #bac964;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(186, 201, 100, 0.05);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #bac964;
            color: #0a0a0f;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            background: #d0e070;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(186, 201, 100, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.2);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            margin-bottom: 15px;
        }

        .error-message.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .login-footer a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #bac964;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10, 10, 15, 0.1);
            border-top-color: #0a0a0f;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }
            
            .login-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="lock-icon"></span>
            <h1>Secure Academic Access</h1>
            <p>Enter credentials to access my hidden content</p>
        </div>

        <div class="error-message" id="errorMessage">
            Invalid username or password. Please try again.
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Access MyHidden Content</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="login-footer">
            <p>Authorized access only · Academic use</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            // Hardcoded credentials for lecture
            const VALID_USERNAME = '219072513hidden';
            const VALID_PASSWORD = '2027Graduate';
            
            errorMsg.classList.remove('show');
            
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            
            setTimeout(() => {
                if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                    sessionStorage.setItem('authenticated', 'true');
                    sessionStorage.setItem('username', username);
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = 'Invalid username or password. Please try again.';
                    errorMsg.classList.add('show');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    document.getElementById('password').value = '';
                }
            }, 800);
        });

        // Check if already authenticated
        if (sessionStorage.getItem('authenticated') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
