<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Portfolio</title>
    <link rel="icon" type="image/png" href="/assets/icons/favicon.ico">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/hero.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="menu">
                <img 
                    class="menu-btn" 
                    id="menuBtn"
                    src="assets/icons/menu-icon.png" 
                    alt="Menu"
                >
                <ul class="menu-items" id="menuItems">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#experience">Experience</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-container" id="home">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">Your Name</h1>
                <p class="hero-description">I'm a Computer Engineer</p>
            </div>
            <div class="hero-buttons">
                <a href="/assets/CV_YourName.pdf" download class="btn-download">
                    Download CV
                </a>
                <button class="btn-contact" id="contactBtn">
                    Contact Me
                </button>
            </div>
        </div>
        <img 
            src="assets/images/hero/hero-image.png" 
            alt="Your Name - Profile" 
            class="hero-image"
        >
    </section>

    <!-- Contact Modal (for the "Contact Me" button) -->
    <div class="modal-overlay" id="contactModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2>Contact Me</h2>
            <form id="contactForm">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
                <div class="modal-buttons">
                    <button type="button" class="btn-back" id="modalBack">Back</button>
                    <button type="submit" class="btn-send">Send</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
